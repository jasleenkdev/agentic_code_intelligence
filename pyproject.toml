[project]
name = "codeintel"
version = "0.1.0"
description = "Agentic code-intelligence assistant for large JavaScript codebases (CPU-only, local models)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
    "slow: loads ML models (embeddings/reranker/whisper)",
    "llm: needs a running Ollama server",
    "e2e: browser end-to-end tests against the real index (./run.sh e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["sample_repo", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
